<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Voice Chat</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Header & Status -->
        <header class="header">
            <div class="logo-title">
                <span class="icon">🎙️</span>
                <h1>Proximity Voice</h1>
            </div>
            <div id="connectionStatus" class="status-badge offline">
                <span class="status-dot"></span>
                <span id="statusText">กำลังเชื่อมต่อ...</span>
            </div>
        </header>

        <!-- Main Card -->
        <main class="card">
            <!-- Step 1: Verification -->
            <section class="section">
                <label for="playerName" class="input-label">ชื่อผู้เล่นใน Minecraft</label>
                <input type="text" id="playerName" class="custom-input" placeholder="กรอกชื่อในเกม เช่น Steve..." autocomplete="off">

                <label for="pinInput" class="input-label">รหัสยืนยัน PIN (6 หลัก)</label>
                <div class="pin-group">
                    <input type="number" id="pinInput" class="custom-input pin-field" placeholder="000000" maxlength="6">
                    <button type="button" id="copyBtn" class="btn btn-secondary">📋 คัดลอก</button>
                </div>
            </section>

            <!-- Step 2: Controls -->
            <section class="section action-area">
                <button type="button" id="connectBtn" class="btn btn-primary btn-large">
                    ⚡ เชื่อมต่อเสียงและระบบ
                </button>
                <div id="messageBox" class="message-box hidden"></div>
            </section>

            <!-- Status Indicator Grid -->
            <section class="status-grid">
                <div class="status-card">
                    <span class="status-title">ไมโครโฟน</span>
                    <span id="micStatus" class="status-value red">ปิดอยู่</span>
                </div>
                <div class="status-card">
                    <span class="status-title">สถานะในเกม</span>
                    <span id="gameStatus" class="status-value yellow">รอยืนยัน</span>
                </div>
            </section>
        </main>

        <footer class="footer">
            <p>Minecraft Proximity Voice System v1.0</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
